gitignore: true

ignores:
  - ".claude/skills/teach/**" # Vendor `npx skills@latest add mattpocock/skills -s teach -a claude-code --copy -y`
  - ".claude/skills/playwright-cli/**" # Vendor `playwright-cli install --skills`

config:
  default: true # Enable all rules by default

  # false == RULE OFF
  MD013: false # enforce a maximum line length
  MD024: false # forbid duplicate heading content
  MD033: false # forbid inline HTML
  MD034: false # forbid bare URLs
  MD036: false # forbid emphasis instead of a heading
  MD059: false # require descriptive link text

  MD060: # enforce consistent table style
    style: compact # single space around cell content
