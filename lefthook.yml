# Git hooks: `npm install` sets them up. Rules: biome.jsonc, .markdownlint-cli2.yaml
pre-commit:
  jobs:
    - name: biome
      glob: "*.{js,mjs,css,html,json,jsonc,yaml,yml}"
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: markdownlint
      glob: "*.md"
      run: npx markdownlint-cli2 --fix {staged_files}
      stage_fixed: true
